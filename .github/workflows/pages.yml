name: Publish the playground

# The build produces plain static files, so Pages just serves the publish output.
# Both the runtime and the Lisp image come from the published DotCL.Runtime
# package, which ships the image and says where it is — nothing here needs a
# dotcl checkout, a Lisp host, or a binary committed to this repository.

on:
  push:
    # Both, so the deploy does not silently never happen on a repository whose
    # default branch is the other one. Nothing here depends on which it is.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # wasm-tools builds for browser-wasm; wasm-experimental supplies the
      # browser app targets this project is built on.
      - run: dotnet workload install wasm-tools wasm-experimental

      - run: dotnet publish src/Playground.csproj -c Release

      # What was actually built, on the run's summary page rather than buried in
      # the log. A page whose whole point is that it downloads a Lisp is one
      # whose weight is the thing to watch, and "the build was green" does not
      # say whether it doubled.
      - name: What the page weighs
        run: |
          bundle=src/bin/Release/net10.0/browser-wasm/AppBundle
          version=$(dotnet msbuild src/Playground.csproj -getProperty:DotclVersion)
          total=$(du -sb "$bundle" | cut -f1)
          {
            echo "Built from DotCL.Runtime **$version**."
            echo
            echo "Everything in the bundle: **$(numfmt --to=iec "$total")**. A first"
            echo "visit fetches less — one of the ICU sets, none of the symbol files."
            echo
            echo "| file | bytes |"
            echo "|---|--:|"
            find "$bundle" -type f -printf '%s\t%P\n' | sort -rn | head -12 |
              while IFS=$'\t' read -r size path; do
                echo "| \`$path\` | $(numfmt --grouping "$size") |"
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/bin/Release/net10.0/browser-wasm/AppBundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
