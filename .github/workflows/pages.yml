name: Publish the playground

# The build produces plain static files, so Pages just serves the publish output.
# The Lisp image is vendored in assets/, and the runtime comes from the published
# DotCL.Runtime package — nothing here needs a dotcl checkout or a Lisp host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # wasm-tools builds for browser-wasm; wasm-experimental supplies the
      # browser app targets this project is built on.
      - run: dotnet workload install wasm-tools wasm-experimental

      - run: dotnet publish src/Playground.csproj -c Release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/bin/Release/net10.0/browser-wasm/AppBundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
